<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Players Paradise Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050711" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #050711;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: pulseGlow 2s infinite ease-in-out;
    }
    .logo-img {
      width: 130px;
      height: 130px;
      border-radius: 28px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.35);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      object-fit: cover;
    }
    .title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #00F0FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 240, 255, 0.15);
      border-top-color: #00F0FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
  </style>
  <script>
    // Seamless auto-redirect to live app if loaded locally
    const targetUrl = 'https://playersparadisehub.com';
    if (window.location.origin !== targetUrl) {
      window.location.replace(targetUrl);
    }
  </script>
</head>
<body>
  <div class="splash-container">
    <img src="logo.png" alt="Players Paradise" class="logo-img" />
    <div class="title">Players Paradise Hub</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
